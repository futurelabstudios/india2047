name: Bug report
description: Something looks or behaves wrong
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes: { label: What happened?, description: Include a screenshot if you can. }
    validations: { required: true }
  - type: input
    id: device
    attributes: { label: Browser and device, placeholder: "Chrome 130, Pixel 7" }
  - type: textarea
    id: console
    attributes: { label: Console errors, render: text }
